<aside class="profile" aria-label="Profile">
  <img class="profile-avatar" src="$avatar" alt="$name" width="160" height="160">
  <div class="profile-summary">
    <h1>$name</h1>
    <p class="profile-position">$role<br>$affiliation</p>
    <p class="profile-interests">$interests</p>
  </div>
</aside>
