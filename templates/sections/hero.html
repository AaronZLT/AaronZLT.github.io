<section class="hero section" id="top">
  <div class="hero-content">
    <h1>$headline</h1>
    <p class="subtitle">$introduction</p>
    <div class="actions">
      <a class="button" href="$scholar_href">$scholar_label</a>
      <a class="button primary" href="$button_href">$button_label</a>
    </div>
  </div>
  <aside class="profile-card" aria-label="Profile summary">
    <p class="profile-name">$name</p>
    <p class="profile-meta">$position</p>
    <a class="profile-email" href="mailto:$email">$email</a>
    <ul class="tags">
$tags
    </ul>
  </aside>
</section>
