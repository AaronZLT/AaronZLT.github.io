<section id="contact" class="section contact-section">
  <div>
    <p class="eyebrow">Contact</p>
    <h2>Get in touch</h2>
    <p>$introduction</p>
  </div>
  <div class="contact-card">
    <a href="mailto:$email">$email</a>
    <p>$affiliation</p>
    <div class="contact-socials" aria-label="Social profiles">
      <a class="social-icon" href="$linkedin_href" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </a>
      <div class="wechat-contact">
        <button class="social-icon" type="button" aria-label="WeChat QR code" aria-describedby="wechat-qr">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <ellipse cx="9" cy="9" rx="8" ry="6.4" fill="currentColor"/>
            <path d="m4.1 13.9-1 3.6 4.1-2.4" fill="currentColor"/>
            <circle cx="6.3" cy="7.5" r="1" fill="var(--white)"/>
            <circle cx="11.7" cy="7.5" r="1" fill="var(--white)"/>
            <ellipse cx="16" cy="15" rx="6.8" ry="5.5" fill="currentColor" stroke="var(--white)" stroke-width="1.2"/>
            <path d="m19.5 18.9 1 3.2-3.6-2.2" fill="currentColor"/>
            <circle cx="13.7" cy="13.8" r=".9" fill="var(--white)"/>
            <circle cx="18.3" cy="13.8" r=".9" fill="var(--white)"/>
          </svg>
        </button>
        <span class="wechat-qr" id="wechat-qr" role="tooltip">
          <img src="$wechat_image" alt="$wechat_alt" width="888" height="1191" loading="lazy">
          <span>$wechat_caption</span>
        </span>
      </div>
    </div>
  </div>
</section>
